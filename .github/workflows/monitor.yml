name: linkedin-monitor
on:
  schedule:
    - cron: "0 6 * * *"   # daily
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: python monitor.py
        env:
          UNIPILE_DSN: ${{ secrets.UNIPILE_DSN }}
          UNIPILE_API_KEY: ${{ secrets.UNIPILE_API_KEY }}
          UNIPILE_ACCOUNT_ID: ${{ secrets.VL_LINKEDIN_ACCOUNT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_API_KEY }}
          NOTION_WATCHLIST_DB: ${{ secrets.NOTION_WATCHLIST_DB }}
          NOTION_POSTS_DB: ${{ secrets.NOTION_POSTS_DB }}
          NOTION_ENGAGERS_DB: ${{ secrets.NOTION_ENGAGERS_DB }}
          NOTION_RUNS_DB: ${{ secrets.NOTION_RUNS_DB }}
          ATTIO_API_KEY: ${{ secrets.ATTIO_API_KEY }}
          LEMLIST_API_KEY: ${{ secrets.LEMLIST_API_KEY }}
