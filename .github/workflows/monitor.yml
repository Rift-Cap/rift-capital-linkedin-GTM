name: linkedin-monitor
on:
  schedule:
    - cron: "0 6 */3 * *"   # roughly every 72h
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: python monitor.py
        env:
          UNIPILE_DSN: ${{ secrets.UNIPILE_DSN }}
          UNIPILE_API_KEY: ${{ secrets.UNIPILE_API_KEY }}
          UNIPILE_ACCOUNT_ID: ${{ secrets.UNIPILE_ACCOUNT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_POSTS_DB: ${{ secrets.NOTION_POSTS_DB }}
          NOTION_ENGAGERS_DB: ${{ secrets.NOTION_ENGAGERS_DB }}
          NOTION_SNAPSHOTS_DB: ${{ secrets.NOTION_SNAPSHOTS_DB }}
          NOTION_RUNS_DB: ${{ secrets.NOTION_RUNS_DB }}
          LEMLIST_API_KEY: ${{ secrets.LEMLIST_API_KEY }}
          LEMLIST_CAMPAIGN_ID: ${{ secrets.LEMLIST_CAMPAIGN_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
